<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Boss-Man · Embedded</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #0b0b0f; color: #ccc;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; font-family: ui-monospace, Menlo, monospace;
  }
  #game {
    width: min(94vw, calc(94vh * 1184 / 666));
    aspect-ratio: 1184 / 666;
    background: #000;
    border-radius: 8px;
    object-fit: contain;
  }
  #footer { font-size: 12px; opacity: 0.55; }
</style></head>
<body>
  <canvas id="game" width="1184" height="666"></canvas>
  <div id="footer">Boss-Man · EMBEDDED build · arrow keys to move · P to play · E for editor</div>
  <script>
    // Runs the Embedded-Swift wasm (bossman-embedded.wasm) with the embedded
    // runtime. This is the canonical/correct artifact (not the debug bossman.wasm).
    window.WASMWEB = {
      logicalWidth:  1184,
      logicalHeight: 666,
      wasmUrl:       'bossman-embedded.wasm?v=emb1',
      assetRoot:     'assets',
      title:         'Boss-Man',
    };
  </script>
  <script src="runtime-embedded-min.js?v=emb1"></script>
</body></html>
